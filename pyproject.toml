[project]
name = "quantedge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amrritt18", email = "amrritt1804@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
    "streamlit>=1.66.0",
    "yfinance>=1.7.0",
]

[project.scripts]
quantedge = "quantedge:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
